models:
  # ─── Cloud Models ──────────────────────────────────────────────────────────

  openai-gpt54:
   id: openai-gpt54
   provider: openai
   model: gpt-5.4
   api_key_env: OPENAI_API_KEY
   cost_per_1m_input: 2.50
   cost_per_1m_output: 15.00
   type: cloud
   description: "OpenAI GPT-5.4 — frontier model for complex professional work"

  openai-gpt4o:
    id: openai-gpt4o
    provider: openai
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    cost_per_1m_input: 2.50
    cost_per_1m_output: 10.00
    type: cloud
    description: "OpenAI GPT-4o — multimodal flagship model"

  openai-o1:
    id: openai-o1
    provider: openai
    model: o1
    api_key_env: OPENAI_API_KEY
    cost_per_1m_input: 15.00
    cost_per_1m_output: 60.00
    type: cloud
    description: "OpenAI o1 — advanced reasoning model"

  openai-o3-mini:
    id: openai-o3-mini
    provider: openai
    model: o3-mini
    api_key_env: OPENAI_API_KEY
    cost_per_1m_input: 1.10
    cost_per_1m_output: 4.40
    type: cloud
    description: "OpenAI o3-mini — efficient reasoning model"

  claude-sonnet:
    id: claude-sonnet
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    cost_per_1m_input: 3.00
    cost_per_1m_output: 15.00
    type: cloud
    description: "Anthropic Claude Sonnet 4.6 — best balance of speed and intelligence"

  claude-opus:
    id: claude-opus
    provider: anthropic
    model: claude-opus-4-6
    api_key_env: ANTHROPIC_API_KEY
    cost_per_1m_input: 15.00
    cost_per_1m_output: 75.00
    type: cloud
    description: "Anthropic Claude Opus 4.6 — most powerful Claude model"

  gemini-2.5-pro:
    id: gemini-2.5-pro
    provider: google
    model: gemini-2.5-pro
    api_key_env: GOOGLE_API_KEY
    cost_per_1m_input: 1.25
    cost_per_1m_output: 10.00
    type: cloud
    description: "Google Gemini 2.5 Pro — deep reasoning and long-context"

  gemini-2.5-flash:
    id: gemini-2.5-flash
    provider: google
    model: gemini-2.5-flash
    api_key_env: GOOGLE_API_KEY
    cost_per_1m_input: 0.15
    cost_per_1m_output: 0.60
    type: cloud
    description: "Google Gemini 2.5 Flash — fast and affordable"

  google-studio-pro:
    id: google-studio-pro
    provider: google
    model: gemini-2.5-pro
    api_key_env: GOOGLE_STUDIO_KEY
    cost_per_1m_input: 1.25
    cost_per_1m_output: 10.00
    type: cloud
    description: "Google AI Studio — Gemini 2.5 Pro via AI Studio"

  deepseek-v3-cloud:
    id: deepseek-v3-cloud
    provider: deepseek
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    api_base: https://api.deepseek.com
    cost_per_1m_input: 0.27
    cost_per_1m_output: 1.10
    type: cloud
    description: "DeepSeek V3 — cloud API"

  deepseek-r1-cloud:
    id: deepseek-r1-cloud
    provider: deepseek
    model: deepseek-reasoner
    api_key_env: DEEPSEEK_API_KEY
    api_base: https://api.deepseek.com
    cost_per_1m_input: 0.55
    cost_per_1m_output: 2.19
    type: cloud
    description: "DeepSeek R1 — cloud reasoning model"

  qwen-2.5-72b:
    id: qwen-2.5-72b
    provider: openai_compatible
    model: qwen-2.5-72b-instruct
    api_key_env: QWEN_API_KEY
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    cost_per_1m_input: 1.10
    cost_per_1m_output: 3.40
    type: cloud
    description: "Alibaba Qwen 2.5 72B — via DashScope"

  # ─── Local Models (Ollama) ─────────────────────────────────────────────────

  qwen-2.5-local:
    id: qwen-2.5-local
    provider: ollama
    model: qwen2.5:3b
    api_base: http://localhost:11434
    cost_per_1m_input: 0.00
    cost_per_1m_output: 0.00
    type: local
    description: "Qwen 2.5 3B — local via Ollama"

  llama3.2-local:
    id: llama3.2-local
    provider: ollama
    model: llama3.2:3b
    api_base: http://localhost:11434
    cost_per_1m_input: 0.00
    cost_per_1m_output: 0.00
    type: local
    description: "Meta Llama 3.2 3B — local via Ollama"

# ─── Routing Configuration ──────────────────────────────────────────────────
routing:
  default_strategy: BEST_VALUE
  fallback_models:
    - openai-gpt4o
    - claude-sonnet
    - gemini-2.5-flash

# ─── Consensus / LLM Council Configuration ─────────────────────────────────
consensus:
  default_council:
    - openai-gpt4o
    - claude-sonnet
    - gemini-2.5-pro
    - deepseek-v3-cloud
  judge_model: openai-gpt4o
  consensus_strategy: synthesis
  min_agreement: 0.6
