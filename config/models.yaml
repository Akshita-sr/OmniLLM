  llama3.2-local:
    id: llama3.2-local
    provider: ollama
    model: llama3.2:3b
    api_base: http://localhost:11434
    cost_per_1m_input: 0.00
    cost_per_1m_output: 0.00
    type: local
    description: "Meta Llama 3.2 3B — local via Ollama"

# ─── Routing Configuration ──────────────────────────────────────────────────
routing:
  default_strategy: BEST_VALUE
  fallback_models:
    - openai-gpt4o
    - claude-sonnet
    - gemini-2.5-flash
  # HRI task-type routing: maps task category → preferred model
  hri_task_routing:
    info_retrieval: openai-gpt4o-mini   # RAG-capable, accurate
    navigation: gemini-flash             # fast, spatial reasoning
    social_conversation: claude-haiku    # natural, empathetic
    multilingual: gemini-flash           # best multilingual support
  # Experimental conditions for Embodied LLM Arena
  hri_conditions:
    A: openai-gpt4o-mini   # Fixed cloud baseline
    B: llama3-8b-local      # Fixed local baseline
    C: smart_routed         # OmniLLM selects per task
    D: consensus            # 3-model council synthesis
    E: no_rag               # RAG-off control (same as A)

# ─── Consensus / LLM Council Configuration ─────────────────────────────────
consensus:
  default_council:
    - openai-gpt4o
    - claude-sonnet
    - gemini-2.5-pro
    - deepseek-v3-cloud
  judge_model: openai-gpt4o
  consensus_strategy: synthesis
  min_agreement: 0.6
