    cost_per_1m_output: 0.00
    type: local
    description: "Alibaba Qwen2.5 7B — multilingual local model via Ollama"
    hri_strengths: ["multilingual", "info_retrieval"]

  qwen-2.5-local:
    id: qwen-2.5-local
    provider: ollama
    model: qwen2.5:3b
    api_base: http://localhost:11434
    cost_per_1m_input: 0.00
