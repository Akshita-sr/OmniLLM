tasks:
  - id: instruction-numbered-list
    category: instruction
    prompt: |
      List exactly 5 benefits of regular exercise. Use a numbered list format (1. 2. 3. 4. 5.).
      Do not add any introduction or conclusion — just the numbered list.
    reference_answer: "A numbered list with exactly 5 items, no intro/conclusion."
    grading_type: llm_judge
    judge_pattern: referenceless
    judge_prompt: |
      Count the numbered items in the response.
      Score 1.0 if exactly 5 numbered items (1-5) with no introduction or conclusion.
      Score 0.7 if exactly 5 items but with introduction/conclusion.
      Score 0.3 if wrong number of items (4 or 6).
      Score 0.0 if completely wrong format or wrong count by 2+.

  - id: instruction-json-schema
    category: instruction
    prompt: |
      Generate a valid JSON object representing a user profile with EXACTLY these fields:
      - "name" (string)
      - "age" (integer between 18-65)
      - "email" (valid email format)
      - "interests" (array of exactly 3 strings)
      - "active" (boolean)
      Output ONLY the JSON, no explanation.
    reference_answer: |
      {"name": "Jane Doe", "age": 30, "email": "jane@example.com", "interests": ["reading", "coding", "hiking"], "active": true}
    grading_type: llm_judge
    judge_pattern: referenceless
    judge_prompt: |
      Parse the output as JSON. Score based on:
      Score 1.0 if valid JSON with all 5 required fields, correct types, email format,
        exactly 3 interests, age in range, and ONLY JSON output (no explanation).
      Score 0.7 if valid JSON but with explanation text around it.
      Score 0.4 if JSON but missing fields or wrong types.
      Score 0.0 if not valid JSON.

  - id: instruction-multi-constraint
    category: instruction
    prompt: |
      Write a product description for a coffee mug that meets ALL these constraints:
      1. Exactly 3 sentences
      2. First sentence must start with "Introducing"
      3. Must mention the word "ceramic" exactly once
      4. Must include a price between $15-$25
      5. Total word count must be between 40-60 words
    reference_answer: "A 3-sentence description meeting all constraints."
    grading_type: llm_judge
    judge_pattern: referenceless
    judge_prompt: |
      Check each constraint:
      1. Count sentences — is it exactly 3?
      2. Does the first sentence start with "Introducing"?
      3. Does "ceramic" appear exactly once?
      4. Is there a price between $15-$25?
      5. Count words — is it 40-60?
      Score = (constraints met) / 5.
      Score 1.0 for all 5, 0.8 for 4/5, 0.6 for 3/5, 0.4 for 2/5, 0.2 for 1/5, 0.0 for 0/5.

  - id: instruction-role-constraint
    category: instruction
    prompt: |
      Explain photosynthesis. Your response must:
      - Be written at a 5th grade reading level
      - Use exactly one analogy
      - Be no longer than 4 sentences
      - Avoid technical jargon (no "chlorophyll", "ATP", "Calvin cycle")
    reference_answer: "Simple 4-sentence explanation with one analogy, no jargon."
    grading_type: llm_judge
    judge_pattern: referenceless
    judge_prompt: |
      Check:
      1. Reading level appropriate for 5th grade (simple vocabulary)?
      2. Exactly one analogy used?
      3. 4 sentences or fewer?
      4. No forbidden words: chlorophyll, ATP, Calvin cycle?
      Score = (constraints met) / 4.
      Score 1.0 for all 4, 0.75 for 3/4, 0.5 for 2/4, 0.25 for 1/4, 0.0 for 0/4.

  - id: instruction-format-table
    category: instruction
    prompt: |
      Create a markdown table comparing 3 programming languages (Python, JavaScript, Rust)
      with exactly these columns: Language | Typing | Primary Use | Learning Curve
      Output ONLY the markdown table.
    reference_answer: |
      | Language | Typing | Primary Use | Learning Curve |
      |---|---|---|---|
      | Python | Dynamic | Data Science/AI | Easy |
      | JavaScript | Dynamic | Web Development | Easy |
      | Rust | Static | Systems Programming | Hard |
    grading_type: llm_judge
    judge_pattern: referenceless
    judge_prompt: |
      Score 1.0 if valid markdown table with correct 4 columns, 3 data rows (Python, JavaScript, Rust),
        and ONLY the table (no extra text).
      Score 0.7 if correct table but with surrounding explanation.
      Score 0.4 if table structure is wrong or missing rows.
      Score 0.0 if not a table.
