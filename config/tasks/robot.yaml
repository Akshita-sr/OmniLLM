tasks:
  - id: robot-nao-greeting-json
    category: robot
    prompt: |
      Generate a JSON action plan for a NAO robot to greet a visitor.
      The JSON must include:
      - "speech": what NAO should say
      - "gesture": the gesture name to perform (e.g., "wave", "bow", "handshake")
      - "movement": object with "direction" and "speed" fields
      - "emotion_led": LED color for the eyes (hex color code)
      Output ONLY valid JSON.
    reference_answer: |
      {
        "speech": "Hello! Welcome, I am NAO. It is a pleasure to meet you!",
        "gesture": "wave",
        "movement": {"direction": "forward", "speed": 0.3},
        "emotion_led": "#00FF00"
      }
    grading_type: llm_judge
    judge_pattern: referenceless
    judge_prompt: |
      Parse the output as JSON. Score based on:
      Score 1.0 if valid JSON with all required fields (speech, gesture, movement with direction+speed, emotion_led as hex).
      Score 0.7 if valid JSON but missing emotion_led or movement sub-fields.
      Score 0.4 if valid JSON but missing major fields.
      Score 0.0 if not valid JSON.

  - id: robot-voice-command-parse
    category: robot
    prompt: |
      Parse the following voice command into a structured robot action JSON:
      "Please walk forward three meters, then turn left 90 degrees and say hello"

      Output JSON with fields:
      - "actions": array of action objects, each with "type" and relevant parameters
    reference_answer: |
      {
        "actions": [
          {"type": "move", "direction": "forward", "distance_meters": 3.0},
          {"type": "rotate", "direction": "left", "degrees": 90},
          {"type": "speech", "text": "hello"}
        ]
      }
    grading_type: llm_judge
    judge_pattern: reference_based
    judge_prompt: |
      Score 1.0 if the JSON correctly captures all 3 actions in order:
        move forward 3 meters, rotate left 90 degrees, say hello.
      Score 0.7 if 2 of 3 actions are correct.
      Score 0.4 if 1 action is correct or actions are out of order.
      Score 0.0 if invalid JSON or missing all actions.

  - id: robot-ros2-nav2-coords
    category: robot
    prompt: |
      A robot is at position (0, 0) facing north. A user says:
      "Go to the kitchen which is 5 meters ahead, then turn right and go 3 meters to the charging station."

      Generate ROS2 Nav2 compatible goal poses as JSON array. Each pose should have:
      - "position": {"x": float, "y": float, "z": 0.0}
      - "orientation": {"x": 0.0, "y": 0.0, "z": float, "w": float} (quaternion)

      Use standard ROS2 coordinate system (x=forward, y=left).
    reference_answer: |
      [
        {
          "position": {"x": 5.0, "y": 0.0, "z": 0.0},
          "orientation": {"x": 0.0, "y": 0.0, "z": 0.0, "w": 1.0}
        },
        {
          "position": {"x": 5.0, "y": -3.0, "z": 0.0},
          "orientation": {"x": 0.0, "y": 0.0, "z": -0.707, "w": 0.707}
        }
      ]
    grading_type: llm_judge
    judge_pattern: reference_based
    judge_prompt: |
      Score 1.0 if the model generates valid Nav2 pose JSON with correct positions
        (kitchen at x=5, charging at x=5,y=-3) and plausible quaternion orientations.
      Score 0.7 if positions are correct but quaternion values are approximate/wrong.
      Score 0.4 if structure is right but positions are wrong.
      Score 0.0 if invalid JSON or completely wrong.

  - id: robot-pepper-interaction-plan
    category: robot
    prompt: |
      Design a multi-step interaction script for Pepper robot to assist an elderly person
      who needs help finding their medication. Output a JSON array of interaction steps,
      each with: "step", "type" (speech/gesture/navigation/sensor), "content", "expected_response"
    reference_answer: "A structured multi-step JSON interaction plan for elderly medication assistance."
    grading_type: llm_judge
    judge_pattern: referenceless
    judge_prompt: |
      Score 1.0 for a well-structured interaction plan with 4+ steps, correct JSON format,
        each step having type/content/expected_response, and a thoughtful human-robot interaction design.
      Score 0.7 for correct JSON but fewer steps or missing fields.
      Score 0.4 for a reasonable plan but poorly structured.
      Score 0.0 for invalid JSON or completely off-topic.

  - id: robot-safety-check
    category: robot
    prompt: |
      A robot is planning to navigate through a crowded area. Before executing a movement command,
      what safety checks should it perform? Generate a JSON safety_checklist with boolean fields
      that must all be True before movement is allowed.
    reference_answer: |
      {
        "safety_checklist": {
          "path_clear": true,
          "obstacle_detection_active": true,
          "emergency_stop_enabled": true,
          "humans_in_safe_distance": true,
          "battery_sufficient": true,
          "sensors_operational": true,
          "speed_within_limits": true
        },
        "all_clear": true
      }
    grading_type: llm_judge
    judge_pattern: referenceless
    judge_prompt: |
      Score 1.0 for a comprehensive safety checklist JSON with 5+ relevant safety checks
        that would be important for robot navigation in crowded spaces.
      Score 0.7 for 3-4 relevant checks.
      Score 0.4 for fewer than 3 or irrelevant checks.
      Score 0.0 for invalid JSON.
