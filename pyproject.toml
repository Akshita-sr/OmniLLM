[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnillm"
version = "0.1.0"
description = "Compare, Route, and Orchestrate Every LLM — Today and Tomorrow"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Akshita-sr"}
]
keywords = ["llm", "ai", "benchmark", "evaluation", "routing", "consensus", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.40.0",
    "rich>=13.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]
robotics = [
    "websockets>=12.0",
    "flask>=3.0",
]
hri = [
    "chromadb>=0.4.0",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    "langdetect>=1.0.9",
]
audio = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "openai>=1.0",
    "faster-whisper>=1.0",
]
all = [
    "omnillm[dev,robotics,hri,audio]",
]

[project.scripts]
omnillm = "omnillm.cli:cli"

[project.urls]
Homepage = "https://github.com/Akshita-sr/OmniLLM"
Repository = "https://github.com/Akshita-sr/OmniLLM"
Issues = "https://github.com/Akshita-sr/OmniLLM/issues"

[tool.setuptools.packages.find]
include = ["omnillm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
